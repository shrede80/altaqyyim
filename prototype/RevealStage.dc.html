<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="fonts/ibm-plex-sans-arabic.css" rel="stylesheet">
<script src="lib/muqayyim.js"></script>
<style>
html,body{margin:0;padding:0;height:100%;background:#0B0B0A}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[data-mq]{--bg:#F6F5F1;--surface:#FFFFFF;--fill:#ECEAE4;--border:#E1DED6;--text:#121211;--text2:#5F5C55;--accent:#1F6F5C;--accent-ink:var(--accent)}
[data-mq="dark"]{--bg:#0B0B0A;--surface:#171716;--fill:#22211F;--border:#2E2D29;--text:#F3F2ED;--text2:#9F9B92;--accent-ink:color-mix(in oklch,var(--accent) 50%,#fff)}
[data-mq] *{box-sizing:border-box}
</style>
</helmet>
<div ref="{{ rootRef }}" onClick="{{ next }}" data-component="RevealStage" dir="rtl" lang="ar" data-mq="dark" style="position:absolute;inset:0;overflow:hidden;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;cursor:pointer;user-select:none">
  <sc-if value="{{ isWait }}" hint-placeholder-val="{{ true }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center">
      <div data-anim="pulse" style="width:900px;height:900px;border-radius:50%;background:radial-gradient(circle,var(--accent) 0%,transparent 62%);opacity:.45"></div>
    </div>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:28px;padding:0 120px;text-align:center">
      <div data-anim="up" style="font-size:34px;font-weight:500;color:var(--text2)">{{ clubName }}</div>
      <div data-anim="up" data-i="1" style="font-size:168px;line-height:1.05;font-weight:700;text-wrap:balance">{{ title }}</div>
    </div>
  </sc-if>
  <sc-if value="{{ isList }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:48px">
      <div data-anim="up" style="font-size:40px;font-weight:500;color:var(--text2)">{{ title }} · من المركز الرابع</div>
      <div style="width:1100px;display:flex;flex-direction:column">
        <sc-for list="{{ lower }}" as="r" hint-placeholder-count="2">
          <div data-anim="up" data-i="{{ r.i }}" style="display:flex;align-items:baseline;gap:48px;padding:26px 0;border-bottom:1px solid var(--border)">
            <span style="width:110px;font-size:60px;font-weight:700;color:var(--text2)">{{ r.rank }}</span>
            <span style="flex:1;font-size:72px;font-weight:500">{{ r.name }}</span>
            <span dir="ltr" style="font-size:56px;font-weight:500;color:var(--text2)">{{ r.avg }}</span>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ isRank }}" hint-placeholder-val="{{ false }}">
    <sc-if value="{{ isFirst }}" hint-placeholder-val="{{ false }}">
      <div data-anim="flash" style="position:absolute;inset:0;background:var(--accent);opacity:0;pointer-events:none"></div>
    </sc-if>
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-bottom:40px">
      <div data-anim="numeral" style="display:flex;flex-direction:column;align-items:center">
        <div style="font-size:48px;font-weight:500;color:var(--text2)">{{ rankLabel }}</div>
        <div style="font-size:420px;line-height:.92;font-weight:700;color:var(--accent-ink)">{{ rankNum }}</div>
      </div>
      <div style="display:flex;gap:160px;justify-content:center;margin-top:24px">
        <sc-for list="{{ current }}" as="r" hint-placeholder-count="1">
          <div data-anim="name" data-i="{{ r.i }}" style="display:flex;flex-direction:column;align-items:center;gap:6px">
            <div style="font-size:{{ nameSize }}px;line-height:1.1;font-weight:700">{{ r.name }}</div>
            <div dir="ltr" style="display:flex;align-items:baseline;gap:12px">
              <span data-count="{{ r.avgNum }}" style="font-size:72px;font-weight:500">{{ r.avg }}</span>
              <span style="font-size:32px;color:var(--text2)">/ {{ max }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
    <sc-if value="{{ isFirst }}" hint-placeholder-val="{{ false }}">
      <div style="position:absolute;inset:0;pointer-events:none">
        <sc-for list="{{ confetti }}" as="c" hint-placeholder-count="0">
          <div data-anim="confetti" data-dx="{{ c.dx }}" data-rot="{{ c.rot }}" data-d="{{ c.d }}" style="position:absolute;top:-40px;width:{{ c.w }}px;height:{{ c.h }}px;left:{{ c.left }};background:{{ c.color }};border-radius:2px;opacity:0"></div>
        </sc-for>
      </div>
    </sc-if>
  </sc-if>
  <sc-if value="{{ isPodium }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:72px 120px 0">
      <div data-anim="up" style="position:absolute;top:72px;right:0;left:0;text-align:center;font-size:52px;font-weight:700">{{ title }}</div>
      <div style="display:flex;align-items:flex-end;gap:28px">
        <sc-for list="{{ podium }}" as="s" hint-placeholder-count="3">
          <div data-anim="podium" data-i="{{ s.i }}" style="width:460px;display:flex;flex-direction:column;align-items:center;gap:24px">
            <div style="display:flex;flex-direction:column;align-items:center;gap:10px">
              <sc-for list="{{ s.rows }}" as="r" hint-placeholder-count="1">
                <div style="display:flex;flex-direction:column;align-items:center">
                  <div style="font-weight:700;line-height:1.15;text-align:center;font-size:{{ s.nameSize }}px">{{ r.name }}</div>
                  <div dir="ltr" style="font-size:36px;font-weight:500;color:var(--text2)">{{ r.avg }}</div>
                </div>
              </sc-for>
            </div>
            <div style="width:100%;display:flex;justify-content:center;padding-top:28px;background:var(--surface);border-top:8px solid {{ s.topColor }};height:{{ s.h }}px">
              <span style="font-size:140px;line-height:1;font-weight:700;color:{{ s.numColor }}">{{ s.rank }}</span>
            </div>
          </div>
        </sc-for>
      </div>
    </div>
  </sc-if>
  <sc-if value="{{ empty }}" hint-placeholder-val="{{ false }}">
    <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:56px;color:var(--text2)">ما وصل أي تقييم بعد</div>
  </sc-if>
  <div style="position:absolute;bottom:36px;left:48px;display:flex;align-items:center;gap:20px;color:var(--text2);font-size:22px;opacity:.6">
    <div style="display:flex;gap:10px">
      <sc-for list="{{ dots }}" as="d" hint-placeholder-count="4"><span style="width:10px;height:10px;border-radius:50%;background:{{ d }}"></span></sc-for>
    </div>
    <span>{{ hint }}</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: false, tick: 0 };
  componentDidMount() {
    const w = () => window.Muq ? (this.detach = Muq.attach(this)) : setTimeout(w, 30); w();
    this.onKey = e => {
      if ([' ', 'ArrowLeft', 'ArrowDown', 'PageDown', 'Enter'].includes(e.key)) { e.preventDefault(); this.move(1); }
      else if (['ArrowRight', 'ArrowUp', 'PageUp', 'Backspace'].includes(e.key)) { e.preventDefault(); this.move(-1); }
    };
    window.addEventListener('keydown', this.onKey);
  }
  componentWillUnmount() { this.detach && this.detach(); window.removeEventListener('keydown', this.onKey); this.stopRaf(); }
  componentDidUpdate() {
    this.applyAccent();
    const key = this.cid + ':' + this.step;
    if (this.state.ready && key !== this.played) { this.played = key; this.play(); }
  }
  applyAccent() { if (this.root && this.accent) this.root.style.setProperty('--accent', this.accent); }
  P() { return this.props.params || (window.Muq ? Muq.params() : {}); }
  move(d) {
    if (!this.seq) return;
    const n = Math.max(0, Math.min(this.seq.length - 1, this.step + d));
    if (n === this.step) return;
    this.step = n;
    try { localStorage.setItem('muq.reveal.' + this.cid, String(n)); } catch (e) {}
    const comp = Muq.comp(this.cid);
    if (this.seq[n].type === 'podium' && comp && comp.status !== 'revealed') Muq.update(() => { comp.status = 'revealed'; });
    this.setState({ tick: this.state.tick + 1 });
  }
  stopRaf() { (this.rafs || []).forEach(cancelAnimationFrame); this.rafs = []; }
  play() {
    const root = this.root; if (!root || !root.animate) return;
    this.stopRaf();
    const ease = 'cubic-bezier(0.2, 0.8, 0.2, 1)';
    root.querySelectorAll('[data-anim]').forEach(el => {
      const t = el.dataset.anim, i = +(el.dataset.i || 0);
      el.getAnimations().forEach(a => a.cancel());
      let kf, o;
      if (t === 'up') { kf = [{ opacity: 0, transform: 'translateY(12px)' }, { opacity: 1, transform: 'none' }]; o = { duration: 600, delay: i * 90, easing: 'ease-out', fill: 'both' }; }
      else if (t === 'numeral') { kf = [{ opacity: 0, transform: 'scale(.94)' }, { opacity: 1, transform: 'none' }]; o = { duration: 600, easing: ease, fill: 'both' }; }
      else if (t === 'name') { kf = [{ opacity: 0, transform: 'translateY(90px)' }, { opacity: 1, transform: 'none' }]; o = { duration: 800, delay: 1000 + i * 120, easing: ease, fill: 'both' }; }
      else if (t === 'flash') { kf = [{ opacity: 0 }, { opacity: .5, offset: .2 }, { opacity: 0 }]; o = { duration: 1200, delay: 1000, fill: 'both' }; }
      else if (t === 'pulse') { kf = [{ opacity: .3, transform: 'scale(.96)' }, { opacity: .55, transform: 'scale(1.04)' }, { opacity: .3, transform: 'scale(.96)' }]; o = { duration: 3200, iterations: Infinity, easing: 'ease-in-out' }; }
      else if (t === 'podium') { kf = [{ opacity: 0, transform: 'translateY(60px)' }, { opacity: 1, transform: 'none' }]; o = { duration: 800, delay: i * 220, easing: ease, fill: 'both' }; }
      else if (t === 'confetti') {
        const dx = +el.dataset.dx, rot = +el.dataset.rot, d = +el.dataset.d;
        kf = [{ opacity: 1, transform: 'translate(0,0) rotate(0deg)' }, { opacity: 1, transform: `translate(${dx}px,1160px) rotate(${rot}deg)` }];
        o = { duration: 1500 + d * 500, delay: 1000 + d * 400, easing: 'cubic-bezier(.25,.6,.45,1)', fill: 'both' };
      }
      if (kf) el.animate(kf, o);
    });
    root.querySelectorAll('[data-count]').forEach(el => {
      const target = parseFloat(el.dataset.count), t0 = performance.now() + 1000;
      el.textContent = '0.0';
      const tick = now => {
        const k = Math.min(1, Math.max(0, (now - t0) / 1200)), e = 1 - Math.pow(1 - k, 3);
        el.textContent = (target * e).toFixed(1);
        if (k < 1) this.rafs.push(requestAnimationFrame(tick));
      };
      this.rafs.push(requestAnimationFrame(tick));
    });
  }
  renderVals() {
    const p = this.P();
    const base = { rootRef: el => { this.root = el; this.applyAccent(); }, next: () => this.move(1), isWait: true, dots: [], lower: [], current: [], podium: [], confetti: [], hint: '' };
    if (!this.state.ready) return base;
    const cid = p.comp || 'c2', comp = Muq.comp(cid) || Muq.db.competitions[0];
    this.cid = cid; this.accent = comp.accent;
    const R = Muq.results(cid);
    const fmt = Muq.fmt;
    const seq = [{ type: 'wait' }];
    const lower = R.rows.filter(r => r.rank >= 4);
    if (lower.length) seq.push({ type: 'list' });
    [...new Set(R.rows.filter(r => r.rank <= 3).map(r => r.rank))].sort((a, b) => b - a)
      .forEach(rank => seq.push({ type: 'rank', rank, rows: R.rows.filter(r => r.rank === rank) }));
    if (R.rows.length) seq.push({ type: 'podium' });
    this.seq = seq;
    if (p.step !== this.seenStep || cid !== this.seenCid) {
      this.seenStep = p.step; this.seenCid = cid;
      let s = p.step === 'end' ? seq.length - 1 : p.step != null && p.step !== '' ? parseInt(p.step, 10) : NaN;
      if (isNaN(s)) { try { s = parseInt(localStorage.getItem('muq.reveal.' + cid) || '0', 10); } catch (e) { s = 0; } }
      this.step = Math.max(0, Math.min(seq.length - 1, s || 0));
    }
    const cur = seq[this.step];
    if (!this.conf) {
      const colors = ['var(--accent)', 'var(--accent-ink)', '#F3F2ED', '#D9B25C'];
      this.conf = Array.from({ length: 70 }, (_, i) => ({ left: (Math.random() * 100) + '%', w: 8 + Math.random() * 10, h: 12 + Math.random() * 14,
        color: colors[i % colors.length], dx: Math.round((Math.random() - .5) * 300), rot: Math.round((Math.random() - .5) * 900), d: Math.random().toFixed(2) }));
    }
    const rowsOut = rows => rows.map((r, i) => ({ i, name: r.group.name, avg: fmt(r.avg), avgNum: (Math.round(r.avg * 10) / 10).toFixed(1), rank: r.rank }));
    let rankLabel = '', current = [];
    if (cur.type === 'rank') {
      current = rowsOut(cur.rows);
      rankLabel = cur.rows.length > 1 ? 'مركز مشترك · ' + Muq.rankWord(cur.rank) : 'المركز ' + Muq.rankWord(cur.rank);
    }
    const slot = rank => R.rows.filter(r => r.rank === rank);
    const H = { 1: 420, 2: 300, 3: 210 };
    const podium = [2, 1, 3].filter(rank => slot(rank).length).map((rank, i) => ({
      i: rank === 1 ? 2 : rank === 2 ? 1 : 0, rank, h: H[rank], rows: rowsOut(slot(rank)),
      nameSize: rank === 1 ? 84 : slot(rank).length > 1 ? 50 : 64,
      topColor: rank === 1 ? 'var(--accent)' : 'var(--border)', numColor: rank === 1 ? 'var(--accent-ink)' : 'var(--text2)'
    }));
    return {
      ...base, clubName: Muq.db.club.name, title: comp.title, max: R.max,
      isWait: cur.type === 'wait', isList: cur.type === 'list', isRank: cur.type === 'rank', isPodium: cur.type === 'podium',
      empty: !R.rows.length && cur.type !== 'wait',
      lower: rowsOut(lower), current, rankLabel, rankNum: cur.rank || '', isFirst: cur.type === 'rank' && cur.rank === 1,
      nameSize: current.length > 1 ? 120 : 160,
      confetti: this.conf, podium,
      dots: seq.map((s, i) => i === this.step ? 'var(--text)' : i < this.step ? 'var(--text2)' : 'var(--border)'),
      hint: this.step < seq.length - 1 ? 'مسافة أو ← للتقدم' : '→ للرجوع'
    };
  }
}
</script>
</body>
</html>
