<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="fonts/ibm-plex-sans-arabic.css" rel="stylesheet">
<script src="lib/muqayyim.js"></script>
<style>
html,body{margin:0;padding:0;height:100%}
body{font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;-webkit-font-smoothing:antialiased}
[data-mq]{--bg:#F6F5F1;--surface:#FFFFFF;--fill:#ECEAE4;--border:#E1DED6;--text:#121211;--text2:#5F5C55;--none:#8D8981;--accent:#1F6F5C;--accent-ink:var(--accent)}
[data-mq="dark"]{--bg:#0E0E0D;--surface:#181817;--fill:#24231F;--border:#2E2D29;--text:#F1F0EB;--text2:#A6A298;--none:#7A766E;--accent-ink:color-mix(in oklch,var(--accent) 55%,#fff)}
[data-mq] *{box-sizing:border-box}
</style>
</helmet>
<div ref="{{ rootRef }}" data-component="PublicResults" dir="rtl" lang="ar" data-mq="{{ theme }}" style="position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;overflow-y:auto">
  <div style="display:flex;justify-content:space-between;align-items:center;padding:18px 20px 0;font-size:14px;color:var(--text2)">
    <span>{{ clubName }}</span><span>{{ date }}</span>
  </div>
  <sc-if value="{{ soon }}" hint-placeholder-val="{{ false }}">
    <div style="flex:1;display:flex;flex-direction:column;justify-content:center;gap:14px;padding:24px 24px 140px">
      <div style="font-size:20px;font-weight:500;color:var(--accent-ink)">{{ title }}</div>
      <div style="font-size:34px;line-height:1.3;font-weight:700">النتائج تُعلن قريباً ✨</div>
    </div>
  </sc-if>
  <sc-if value="{{ shown }}" hint-placeholder-val="{{ true }}">
    <div style="padding:24px 20px 8px;display:flex;flex-direction:column;gap:4px">
      <div style="font-size:15px;color:var(--text2)">النتائج النهائية</div>
      <h1 style="margin:0;font-size:34px;line-height:1.2;font-weight:700;color:var(--accent-ink)">{{ title }}</h1>
    </div>
    <div style="display:flex;flex-direction:column;padding:8px 20px 24px">
      <sc-for list="{{ rows }}" as="r" hint-placeholder-count="5">
        <div style="display:flex;flex-direction:column;gap:8px;padding:16px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:baseline;gap:14px">
            <span style="width:40px;font-weight:700;color:{{ r.rankColor }};font-size:{{ r.rankSize }}px">{{ r.rank }}</span>
            <span style="flex:1;font-weight:700;font-size:{{ r.nameSize }}px">{{ r.name }}</span>
            <span dir="ltr" style="font-size:20px;font-weight:500">{{ r.avg }}</span>
          </div>
          <sc-if value="{{ r.tied }}" hint-placeholder-val="{{ false }}"><span style="margin-right:54px;align-self:flex-start;font-size:13px;font-weight:500;padding:2px 10px;border-radius:99px;background:var(--fill)">مركز مشترك</span></sc-if>
          <sc-if value="{{ showBreakdown }}" hint-placeholder-val="{{ false }}">
            <div style="margin-right:54px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--text2)">
              <sc-for list="{{ r.crit }}" as="c" hint-placeholder-count="4"><span>{{ c }}</span></sc-for>
            </div>
          </sc-if>
          <sc-if value="{{ showPerJudge }}" hint-placeholder-val="{{ false }}">
            <div style="margin-right:54px;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:14px;color:var(--text2)">
              <sc-for list="{{ r.judges }}" as="c" hint-placeholder-count="3"><span>{{ c }}</span></sc-for>
            </div>
          </sc-if>
        </div>
      </sc-for>
    </div>
  </sc-if>
  <div style="margin-top:auto;padding:20px;text-align:center;font-size:14px;font-weight:700;color:var(--text2)">المقيّم</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { ready: false };
  componentDidMount() { const w = () => window.Muq ? (this.detach = Muq.attach(this)) : setTimeout(w, 30); w(); }
  componentDidUpdate() { this.applyAccent(); }
  componentWillUnmount() { this.detach && this.detach(); }
  applyAccent() { if (this.root && this.accent) this.root.style.setProperty('--accent', this.accent); }
  renderVals() {
    const p = this.props.params || (window.Muq ? Muq.params() : {});
    const theme = this.props.theme || (p.theme === 'dark' ? 'dark' : 'light');
    const base = { theme, rootRef: el => { this.root = el; this.applyAccent(); }, soon: false, shown: false, rows: [] };
    if (!this.state.ready) return base;
    const cid = p.comp || 'c2', comp = Muq.comp(cid) || Muq.db.competitions[0];
    this.accent = comp.accent;
    const revealed = Muq.status(comp, p) === 'revealed';
    const R = Muq.results(cid);
    return {
      ...base, clubName: Muq.db.club.name, date: Muq.date(comp.createdAt), title: comp.title,
      soon: !revealed, shown: revealed, showBreakdown: !!comp.showBreakdown, showPerJudge: !!comp.showPerJudge,
      rows: R.rows.map(r => ({
        rank: r.rank, name: r.group.name, avg: Muq.fmt(r.avg), tied: r.tied,
        rankSize: r.rank <= 3 ? 28 : 20, nameSize: r.rank <= 3 ? 22 : 18, rankColor: r.rank === 1 ? 'var(--accent-ink)' : 'var(--text2)',
        crit: R.criteria.map(k => (k.emoji ? k.emoji + ' ' : '') + k.name + ' ' + Muq.fmt(r.crit[k.id])),
        judges: R.assignments.filter(a => r.per[a.judgeId] != null).map(a => Muq.judge(a.judgeId).name + ' ' + r.per[a.judgeId])
      }))
    };
  }
}
</script>
</body>
</html>
